name: mfw_app
description: "MFW app scaffold (placeholder identifiers)"
publish_to: 'none'
version: 0.1.0+1

environment:
  # Pinned at the scaffold (OQ-50): Flutter 3.47.9 with Dart 3.13.7. Later
  # 3.47 patch releases are allowed, and 3.48 needs a deliberate change here.
  sdk: ^3.13.7
  flutter: ">=3.47.9 <3.48.0"

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  connectivity_plus: ^7.3.2
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The licence of each typeface ships with it (SIL Open Font License 1.1,
  # condition 2) and is shown on the licence page (DEP-78).
  assets:
    - assets/fonts/fraunces/OFL.txt
    - assets/fonts/inter/OFL.txt
    - assets/fonts/plus_jakarta_sans/OFL.txt

  # The typefaces of MFW's website (BRAND_REFERENCE section 5, DEP-78). Each
  # file is the upright variable font, so the theme sets the weight axis.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
