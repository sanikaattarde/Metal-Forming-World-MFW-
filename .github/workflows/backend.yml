# QG-08: backend and authorization-rule tests (MOD15-P2-T02,
# CI_CD_AND_QUALITY_GATES.md section 4). Runs the emulator tests of backend/
# (MOD13-P1-T01 to T03) on the Firestore and Storage emulators, for the
# project demo-mfw: no login, no cloud project, no secret.
#
# A separate workflow from pr.yml, so a pull request that changes only app/
# does not run it, and one that changes only backend/ does not build the app.

name: PR checks (backend)

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: pr-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  rules:
    name: QG-08 backend and authorization-rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up Java 21 for the emulators
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Show the toolchain
        run: |
          node --version
          npm --version
          java -version
      - name: Install from the lockfile
        run: npm ci
      - name: QG-08 rule tests on the emulators
        run: npm test
