# QG-10, QG-11 and QG-12 (MOD15-P2-T01, CI_CD_AND_QUALITY_GATES.md section 4).
# - QG-11, the secrets scan, fails the run: gitleaks at a pinned version, its download checked against the
#   release's SHA-256, over the whole history.
# - QG-10, the dependency and licence check, and QG-12, the documentation check, report only until their
#   false positives are tuned. Each runs locally with the command shown in its step.
# No secret, no login and no cloud project is used.

name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # QG-10's weekly report, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets:
    name: QG-11 secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out, with the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks at the pinned version, checked
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check
          tar -xzf "$file" gitleaks
      - name: QG-11 scan (locally, with gitleaks installed, run `gitleaks git --redact .`)
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  licences:
    name: QG-10 dependency and licence check (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the npm packages without running their scripts
        run: |
          for folder in backend backend/functions admin; do
            (cd "$folder" && npm ci --ignore-scripts --no-audit --no-fund)
          done
      - name: QG-10 (locally, `python3 scripts/checks/licence_check.py`)
        run: python3 scripts/checks/licence_check.py

  docs:
    name: QG-12 documentation check (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: QG-12 (locally, `python3 scripts/checks/doc_check.py`)
        run: python3 scripts/checks/doc_check.py
