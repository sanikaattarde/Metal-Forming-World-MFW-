# Pull-request checks for the Flutter app: QG-01 to QG-06 of
# Documentation/CI_CD_AND_QUALITY_GATES.md section 4.
# DEC-022 (GitHub Actions) is PROPOSED and conditional on a cost check.
# FLUTTER_VERSION is the version used for the scaffold. The pin is OQ-50.
# GitHub-owned actions only, pinned to full commit SHAs. No secrets.

name: PR checks (app)

on:
  pull_request:
    paths:
      - "app/**"

permissions:
  contents: read

concurrency:
  group: pr-app-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: QG-01 to QG-04 (format, analyze, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flutter from the official repository at the pinned tag
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Show the toolchain
        run: flutter --version
      - name: Get packages
        run: flutter pub get
      - name: QG-01 formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: QG-02 static analysis
        run: flutter analyze
      - name: QG-03 unit and widget tests, with coverage for QG-04
        run: flutter test --coverage
      - name: QG-04 coverage report (report only, no threshold)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  android:
    name: QG-05 Android build check
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter from the official repository at the pinned tag
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Show the toolchain
        run: flutter --version
      - name: Get packages
        run: flutter pub get
      - name: QG-05 debug APK
        run: flutter build apk --debug

  ios:
    name: QG-06 iOS build check (no code signing)
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flutter from the official repository at the pinned tag
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Show the toolchain
        run: |
          flutter --version
          xcodebuild -version
      - name: Get packages
        run: flutter pub get
      - name: QG-06 iOS build without code signing
        run: flutter build ios --no-codesign
